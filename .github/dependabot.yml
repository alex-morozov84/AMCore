# Dependabot: auto PRs for patch/minor, majors ignored (check with: pnpm outdated)
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      npm-non-major:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'patch'
          - 'minor'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # jest-mock-extended: 4.0.1+ breaks Prisma 7's generic-overloaded groupBy
      # mock type inference (ai/BACKLOG.md has the full trace: PR #243, #275,
      # #280/#283, #286 all reverted the same failure). Upstream root cause is
      # confirmed (marchaos/jest-mock-extended#147) with a fix already written
      # (#148), but the repo's been inactive since 2026-04-20 with no ETA.
      # Remove this entry once a clean version is confirmed and re-pinned.
      - dependency-name: 'jest-mock-extended'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      github-actions-non-major:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'patch'
          - 'minor'
    commit-message:
      prefix: 'ci'
