name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: |
          pnpm test
          pnpm --filter api test:e2e -- process-role.e2e-spec.ts shutdown-drain.e2e-spec.ts
          pnpm --filter web test:integration

  docker-image-smoke:
    name: Docker production image smoke
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      AMCORE_API_IMAGE: amcore-api:smoke
      AMCORE_API_MIGRATOR_IMAGE: amcore-api-migrator:smoke
      COMPOSE_FILE: docker-compose.yml:.github/compose.boot-smoke.override.yml
      COMPOSE_PROFILES: local-infra
      COMPOSE_PROJECT_NAME: amcore-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.71.0
          TRIVY_LINUX_64BIT_SHA256: 30a3d22b23f88c233f1658f562fb477cae3b3e8b4761109d515b7698daf85814
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$asset" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${asset}"
          printf '%s  %s\n' "$TRIVY_LINUX_64BIT_SHA256" "$RUNNER_TEMP/$asset" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build production runner image
        run: docker build -f apps/api/Dockerfile -t "$AMCORE_API_IMAGE" .

      - name: Build production migrator image
        run: docker build -f apps/api/Dockerfile --target migrator -t "$AMCORE_API_MIGRATOR_IMAGE" .

      - name: Smoke-test the migrator image
        run: |
          docker run --rm "$AMCORE_API_MIGRATOR_IMAGE" sh -lc '
            ./node_modules/.bin/prisma --version
            test -x ./node_modules/.bin/prisma
          '

      - name: Verify npm/npx are absent from the runner image
        run: |
          docker run --rm "$AMCORE_API_IMAGE" sh -lc '
            node --version
            if command -v npm >/dev/null 2>&1; then
              echo "npm unexpectedly present in runner image"
              exit 1
            fi
            if command -v npx >/dev/null 2>&1; then
              echo "npx unexpectedly present in runner image"
              exit 1
            fi
            echo "npm/npx absent, node OK"
          '

      - name: Scan the built runner image with Trivy
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format sarif \
            --output trivy-results.sarif \
            "$AMCORE_API_IMAGE"

      - name: Upload Trivy SARIF
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # Verify the self-contained production app image (pnpm deploy bundle):
      # 1. native sharp/libvips loads AND encodes (not just require) — catches a
      #    missing/wrong native binary or broken codec the host platform hides;
      # 2. critical runtime deps resolve from the bundle's flat node_modules —
      #    proves the pnpm-workspace packaging is self-contained;
      # 3. the compiled generated Prisma client is present while the Prisma CLI is absent;
      # 4. React email templates render from the production SWC output and
      #    pnpm deploy bundle (catches missing react/jsx-runtime/react-dom deps).
      # Runs as the image's non-root user from the production WORKDIR.
      - name: Smoke-test the built runner image
        run: |
          docker run --rm "$AMCORE_API_IMAGE" node -e "
            const sharp = require('sharp');
            sharp({ create: { width: 8, height: 8, channels: 3, background: '#000' } })
              .webp()
              .toBuffer()
              .then((b) => {
                if (!b || b.length === 0) throw new Error('empty WebP buffer');
                console.log('sharp WebP encode OK:', b.length, 'bytes');
                for (const m of ['@nestjs/core', '@prisma/client/runtime/client', 'argon2', 'bullmq', 'nestjs-pino']) {
                  require.resolve(m);
                }
                console.log('runtime module resolution OK');
                if (typeof require('./dist/generated/prisma/client.js').PrismaClient !== 'function') {
                  throw new Error('Prisma client not generated');
                }
                try {
                  require.resolve('prisma');
                  throw new Error('Prisma CLI unexpectedly present in app image');
                } catch (err) {
                  if (err.code !== 'MODULE_NOT_FOUND') throw err;
                }
                console.log('Prisma client present OK');
                const { render } = require('@react-email/render');
                const { default: WelcomeEmail } = require('./dist/infrastructure/email/templates/welcome.js');
                return render(WelcomeEmail({ name: 'CI', appName: 'AMCore' }));
              })
              .then((html) => {
                if (!html.includes('CI')) throw new Error('email render output missing expected name');
                console.log('React email render OK:', html.length, 'bytes');
              })
              .catch((err) => {
                console.error('image smoke failed:', err);
                process.exit(1);
              });
          "

      - name: Render compose config for boot smoke
        run: |
          docker compose config > "$RUNNER_TEMP/boot-smoke-compose.yml"
          ruby -e '
            require "yaml"
            config = YAML.load_file(ARGV[0])
            %w[api worker].each do |name|
              service = config.fetch("services").fetch(name)
              raise "#{name} build unexpectedly present" if service.key?("build")
              raise "#{name} image mismatch: #{service["image"]}" unless service["image"] == ENV.fetch("AMCORE_API_IMAGE")
            end
            migrate = config.fetch("services").fetch("migrate")
            raise "migrate build unexpectedly present" if migrate.key?("build")
            raise "migrate image mismatch: #{migrate["image"]}" unless migrate["image"] == ENV.fetch("AMCORE_API_MIGRATOR_IMAGE")
            puts "compose image override OK"
          ' "$RUNNER_TEMP/boot-smoke-compose.yml"

      - name: Boot the scanned image via docker compose
        run: docker compose up -d --build

      - name: Verify migrate, api, web, and worker
        run: |
          migrate_cid=""
          for attempt in $(seq 1 60); do
            migrate_cid="$(docker compose ps -aq migrate)"
            if [ -n "$migrate_cid" ]; then
              status="$(docker inspect -f '{{.State.Status}}' "$migrate_cid")"
              if [ "$status" = "exited" ]; then
                code="$(docker inspect -f '{{.State.ExitCode}}' "$migrate_cid")"
                if [ "$code" -ne 0 ]; then
                  echo "migrate exited with $code"
                  exit 1
                fi
                echo "migrate exit 0"
                break
              fi
            fi
            sleep 2
          done
          if [ -z "$migrate_cid" ]; then
            echo "migrate container not created"
            exit 1
          fi
          if [ "$(docker inspect -f '{{.State.Status}}' "$migrate_cid")" != "exited" ]; then
            echo "migrate did not finish in time"
            exit 1
          fi

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5002/api/v1/health/ready > /dev/null; then
              echo "api ready 200"
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "api readiness check timed out"
              exit 1
            fi
            sleep 2
          done

          for attempt in $(seq 1 60); do
            # -L follows the locale redirect: `/` now 307s to the default
            # locale (`/en`) because `localePrefix` is `always`. Following it
            # also keeps this a real readiness check — it proves a localized
            # page actually renders, not merely that a redirect header is
            # emitted.
            status="$(curl -fsSL -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)"
            if [ "$status" = "200" ]; then
              echo "web 200"
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "web readiness check timed out"
              exit 1
            fi
            sleep 2
          done

          worker_cid=""
          for attempt in $(seq 1 60); do
            worker_cid="$(docker compose ps -q worker)"
            if [ -n "$worker_cid" ]; then
              health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$worker_cid")"
              if [ "$health" = "healthy" ]; then
                echo "worker healthy"
                exit 0
              fi
            fi
            sleep 2
          done
          echo "worker did not become healthy"
          exit 1

      - name: Dump compose logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Tear down boot smoke stack
        if: always()
        run: docker compose down -v

  web-e2e:
    name: Web E2E
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm test:e2e` runs Playwright directly in apps/web, bypassing
      # turbo (whose own `test` task depends on `^build` and builds this
      # transparently for the `test` job). apps/web imports the built
      # dist, not source, so this is required here too.
      - name: Build @amcore/shared
        run: pnpm --filter @amcore/shared build

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # Mocked + server-mocked lanes (Track 7 FINAL PLAN §1/§4,
      # ai/models-talk.md): infra-free, Playwright manages its own `next dev`
      # via playwright.config.ts's webServer. No env file needed — verified
      # empirically that both lanes boot and pass with none present.
      - name: Run mocked + server-mocked E2E lanes
        working-directory: apps/web
        run: pnpm test:e2e

      # Real-stack lane: the only one that proves auth/BFF/cookies/Redis/App
      # Router end to end (§4). Builds fresh rather than reusing another
      # job's image — this job's own point is the E2E suite, not image
      # provenance (that's `docker-image-smoke`'s job).
      - name: Boot the real-stack profile
        run: docker compose --profile local-infra up -d --build

      - name: Wait for web readiness
        run: |
          for attempt in $(seq 1 60); do
            # -L follows the locale redirect (`localePrefix: 'always'`).
            status="$(curl -fsSL -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)"
            if [ "$status" = "200" ]; then
              echo "web 200"
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "web readiness check timed out"
              exit 1
            fi
            sleep 2
          done

      - name: Run real-stack E2E lane
        working-directory: apps/web
        run: pnpm test:e2e:real-stack

      - name: Dump compose logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Upload Playwright reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-reports
          path: |
            apps/web/playwright-report/
            apps/web/playwright-report-real-stack/
            apps/web/test-results/
          retention-days: 7

      - name: Tear down real-stack stack
        if: always()
        run: docker compose down -v

  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    # No job in this file previously set this; added here after a real
    # incident (2026-08-18, PR #329's first run) where `apt-get install`
    # (invoked internally by `playwright install --with-deps`) hung on an
    # unanswered interactive prompt — a known needrestart/Ubuntu-runner issue
    # that ignores DEBIAN_FRONTEND on its own apt post-invoke hook — and ran
    # until GitHub's default 6-hour job timeout killed it instead of failing
    # fast. `web-e2e` runs the identical install command and shares this
    # exposure; not touched here since it's outside this track's scope, but
    # flagged in ai/BACKLOG.md as a real follow-up, not a hypothetical one.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Stories import @amcore/shared directly (AuthErrorCode, DEFAULT_LOCALE);
      # apps/web resolves it through its built dist, same reasoning as
      # web-e2e's own "Build @amcore/shared" step.
      - name: Build @amcore/shared
        run: pnpm --filter @amcore/shared build

      # No Docker/real-stack needed here — every story's API surface is
      # mocked via msw-storybook-addon, not a real apps/api. Much lighter
      # than web-e2e for that reason.
      #
      # DEBIAN_FRONTEND/NEEDRESTART_MODE: `--with-deps` runs `sudo apt-get
      # install` for Chromium's system libraries. Without these, an
      # interactive prompt (commonly needrestart's "which services to
      # restart" dialog, which has its own known history of ignoring
      # DEBIAN_FRONTEND=noninteractive in its apt post-invoke hook) can hang
      # indefinitely with no TTY to answer it — confirmed live, not
      # theoretical (see this job's timeout-minutes comment above).
      - name: Install Playwright Chromium
        working-directory: apps/web
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: npx playwright install --with-deps chromium

      # Cheap compile/broken-story smoke first — catches a decorator or
      # import error fast, before paying for the full browser test run.
      - name: Build Storybook
        working-directory: apps/web
        run: pnpm build-storybook

      # The actual gate: every story as a Vitest test (smoke render + any
      # play function), with addon-a11y's checks running inside the same
      # run via parameters.a11y.test: 'error' (.storybook/preview.tsx).
      - name: Run Storybook a11y/interaction tests
        working-directory: apps/web
        run: pnpm test:storybook
