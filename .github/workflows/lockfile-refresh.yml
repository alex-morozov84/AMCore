name: Lockfile refresh

on:
  schedule:
    - cron: '0 7 * * 2' # Tuesday, after Monday's Dependabot updates
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lockfile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Refresh compatible resolutions
        # Preserve holds, the Next.js patch and the reviewed Bull Board boundary.
        run: |
          pnpm --recursive --include-workspace-root update \
            --depth Infinity --lockfile-only --no-save --ignore-scripts --ignore-pnpmfile \
            '!nestjs-cls' '!jest-mock-extended' '!next' '!@bull-board/*'
      - name: Create or update refresh PR
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          add-paths: pnpm-lock.yaml
          branch: chore/lockfile-refresh
          base: main
          commit-message: 'chore(deps): refresh dependency lockfile'
          title: 'chore(deps): refresh dependency lockfile'
          body: |
            Refresh direct and transitive resolutions within the existing manifest ranges.
            Preserve exact pins, held packages and the root release-age policy.
            Review the diff and all required PR checks before merging.
