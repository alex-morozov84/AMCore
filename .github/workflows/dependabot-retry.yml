name: Dependabot install retry

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependabot-install-retry
  cancel-in-progress: false

jobs:
  retry:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - name: Checkout trusted controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/lib/dependabot-retry.mjs
          sparse-checkout-cone-mode: false
      - name: Retry eligible failed installs once
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { pathToFileURL } = require('node:url')
            const { resolve } = require('node:path')
            const controller = await import(pathToFileURL(resolve('scripts/lib/dependabot-retry.mjs')).href)
            await controller.retryDependabot({ github, context, core })
