# Client authentication for the bundled Postgres with docker/compose/postgres-tls.yml.
# First matching line wins.
#
# Unix socket inside the container only: the healthcheck and the administrator bootstrap
# through `docker compose exec postgres psql -U amcore` (whoever can run that already
# controls the container).
local   all     all                                                 trust
# Network: TLS only, and only the application roles from database-role-separation.md.
hostssl amcore  amcore_migrator,amcore_runtime,amcore_observer,amcore_backup  all  scram-sha-256
# Everything else over the network is refused: plaintext TCP, the amcore superuser,
# unknown roles and other databases.
host    all     all                                             all  reject
