# AMCore — Loki single-binary configuration for the log-search reference overlay
# (docker/compose/logs.yml, docs/operations/log-search.md).
#
# One node, filesystem storage, no authentication: the overlay publishes no Loki port and
# only the overlay's own Grafana and Alloy share Loki's internal network. Anything else on that
# network reads all logs. The one allowed addition is the operator's own Prometheus, for
# scraping; it can then read every stored line, so treat it like Grafana. Do not publish Loki
# without an authenticating reverse proxy in front (Loki has no built-in authentication).
#
# `${VAR:-default}` is expanded by Loki itself (`-config.expand-env=true`).

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# The index period must be 24h for retention (Loki retention docs).
schema_config:
  configs:
    - from: '2024-01-01'
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

# Retention is off in Loki by default: logs would live forever and fill the volume.
compactor:
  working_directory: /loki/retention
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

limits_config:
  retention_period: ${LOGS_RETENTION_PERIOD:-168h}
  # Older lines are refused: after a long collector outage an unbounded replay of old
  # files would otherwise write chunks that retention deletes straight away.
  reject_old_samples: true
  reject_old_samples_max_age: ${LOGS_RETENTION_PERIOD:-168h}
  # Ingestion bounds keep a runaway logger from filling the volume faster than an
  # operator can react. Raise them only with the volume size in mind.
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 6MB
  max_global_streams_per_user: 1000
  max_label_names_per_series: 8

# No usage reporting from a self-hosted reference deployment.
analytics:
  reporting_enabled: false
