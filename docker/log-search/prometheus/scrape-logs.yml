# Prometheus scrape jobs for the log-search reference overlay (docker/compose/logs.yml).
# Copy these jobs into the `scrape_configs` of a Prometheus that can reach the overlay's
# internal `logs` network (attach that Prometheus to the network). They feed
# docs/operations/prometheus/optional/amcore-log-shipping.yml.
#
# Security: Loki has no authentication. A Prometheus on the `logs` network can read ALL stored
# logs from Loki and open Alloy's HTTP UI, not only scrape metrics. Attach only a Prometheus
# you run and trust as much as the log Grafana, and attach nothing else.
#
# Alloy and Loki publish no host port. Alloy serves its own metrics and, through its component
# HTTP path, the filesystem metrics of the read-only Loki volume.
scrape_configs:
  - job_name: amcore-log-collector
    metrics_path: /metrics
    static_configs:
      - targets: ['alloy:12345']

  - job_name: amcore-log-collector-disk
    metrics_path: /api/v0/component/prometheus.exporter.unix.disk/metrics
    static_configs:
      - targets: ['alloy:12345']

  - job_name: amcore-loki
    metrics_path: /metrics
    static_configs:
      - targets: ['loki:3100']
