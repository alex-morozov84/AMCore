# Reference include for a TLS nginx edge on the same private network as web.
# Replace example names and certificate paths in the consuming nginx config.

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    return 444;
}

server {
    listen 443 ssl;
    server_name app.example.com;
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# AMCORE_ADMIN_CONSOLE_PROXY_START — PR5 owns this block's deletion transform.
server {
    listen 443 ssl;
    server_name console.example.com;
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    if ($request_uri ~* "^/[^?]*(?:%2e|%2f|%5c)") {
        return 400;
    }

    location = /admin {
        return 404;
    }

    location ^~ /admin/ {
        return 404;
    }

    location ~ ^(/(?:en|ru)(?:/.*[^/])?)/$ {
        return 308 $scheme://$host$1$is_args$args;
    }

    location = /api/csp-report {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/deployment-version {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The queue board's root has a trailing slash (its page base). Next.js would redirect it to the
    # slashless address and that redirect names the physical /api/console/ path, so the root is
    # mapped to the slashless physical route here (the query string is kept).
    # Both spellings are exact locations: with only the slash form defined, nginx itself answers the
    # slashless address with a redirect.
    location = /api/bull-board/ {
        rewrite ^ /api/console/bull-board break;
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/bull-board {
        rewrite ^ /api/console/bull-board break;
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        rewrite ^/api/(.*)$ /api/console/$1 break;
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(en|ru)(/.*)?$ {
        rewrite ^/(en|ru)(/.*)?$ /$1/admin$2 break;
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# AMCORE_ADMIN_CONSOLE_PROXY_END
