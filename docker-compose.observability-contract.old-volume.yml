# AMCore — old-volume migration smoke, PHASE A (observability-contract live
# tier). Boots `grafana` against the LEGACY pre-fix datasource provisioning
# (docker/monitoring/grafana/provisioning-legacy-fixture/ — no explicit uid,
# no deleteDatasources), reproducing a `grafana_data` volume created before
# the real provisioning's fixed uid existed. Always run under its own
# COMPOSE_PROJECT_NAME and a non-default host port — never the same project
# as the main live-tier stack. See docker-compose.observability-contract.old-volume.migrated.yml
# for phase B (same project/volume, real shipped provisioning).
services:
  grafana:
    # This smoke only exercises Grafana's own datasource-provisioning
    # identity — it never queries real data — so it does not need a working
    # Prometheus behind it. Clears the base file's `depends_on: [prometheus]`
    # (which would otherwise transitively pull in the whole app stack) so
    # `up -d grafana` starts only this one container.
    depends_on: !override []
    ports: !override
      - '127.0.0.1:3099:3000'
    volumes:
      - ./docker/monitoring/grafana/provisioning-legacy-fixture:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
