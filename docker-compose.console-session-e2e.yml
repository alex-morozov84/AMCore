# HTTPS-only local harness for the Operations Console session contract.
services:
  web:
    environment:
      ADMIN_CONSOLE_HOSTNAME: console.localhost
      WEB_TRUSTED_ORIGINS: https://app.localhost

  caddy:
    environment:
      CADDY_DOMAIN: api.localhost
      CADDY_EMAIL: console-e2e@example.invalid
      CADDY_WEB_DOMAIN: app.localhost
      ADMIN_CONSOLE_HOSTNAME: console.localhost
    volumes:
      - ./docker/caddy/Caddyfile.console-host:/etc/caddy/Caddyfile:ro
